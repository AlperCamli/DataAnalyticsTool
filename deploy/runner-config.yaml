# Runner config for the Compose stack (connectors.sdk.service).
# Credential references resolve against the runner's process
# environment (compose `environment:`/`env_file:` — the local-dev vault
# per ruling D1).
core_url: http://core:8100
token_env: CL_RUNNER_TOKEN
runner_id: runner-local
connectors:
  - connectors.static_demo.connector:connector
  - connectors.postgres.connector:connector
  - connectors.ga4.connector:connector
  - connectors.gsc.connector:connector
  # CP-7: publisher adapters — publish jobs ride the same interactive
  # lane as execute. looker_studio is template_link and needs no
  # credentials at all; powerbi is the api-class leg (D-91) and resolves
  # its POWERBI_* keys through the same process-env resolver. Without
  # the powerbi line a clean checkout builds a runner that cannot claim
  # a `powerbi` publish job — the READINESS-2026-07-29 NO-GO (D-96.4 C-1).
  - connectors.looker_studio.connector:connector
  - connectors.powerbi.connector:connector
# `interactive` is the execute/publish lane (CP-6). Without it this
# runner claims snapshot work only and execute_sql has nobody to serve it.
classes: [batch, interactive]
wait_s: 25
resolver:
  kind: process-env

# G3 startup gate: prove the execution role cannot write before this
# runner offers to claim `execute` jobs. If CL_EXEC_DSN is unset or
# points at a role with write grants, the runner logs why and withholds
# `execute` from its claim declaration — snapshot sync keeps running.
# Provision the role with deploy/execution-role.sql.
execution_preflight:
  - connector: postgres
    config:
      system: supabase
      execute_dsn_env: CL_EXEC_DSN

name: ga4
version: 0.2.0
protocol_version: 1
snapshot_version: "1"
capabilities:
  metadata: { modes: [api] }
  # Data API runReport, the one documented operation (capability §6).
  query: { dialect: api }
config_schema: ./config.schema.json
credentials:
  - key: service_account
    required_for: [api]
    description: >-
      Read-access service-account JSON key, as a vault reference once the
      job transport resolves credentials (J-4). Local/CLI runs supply
      config.credentials_file or config.credentials_env instead
      (DECISIONS.md D-28) - references only, never key material in config.
# Honored by the SDK quota primitives (connectors/sdk/quota.py, D-28):
# token-bucket pacing per request, exponential backoff on 429, and when
# still throttled after max_retries, a J-5 deferral of retry_after_s
# from the Retry-After header (falling back to default_retry_after_s -
# GA4 property-token quotas refill on hourly windows).
rate_limit:
  strategy: token-bucket
  rate_per_s: 5
  burst: 5
  max_retries: 4
  default_retry_after_s: 3600
health_probe: builtin

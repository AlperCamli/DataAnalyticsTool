name: postgres
version: 0.2.0
protocol_version: 1
snapshot_version: "1"
capabilities:
  metadata: { modes: [ddl-file, live] }
  query: { dialect: postgresql }
config_schema: ./config.schema.json
credentials:
  - key: dsn
    required_for: [live]
    description: >-
      Read-only-role DSN for live mode, as a vault reference once the job
      transport resolves credentials (J-4). Local/CLI runs supply
      config.dsn or config.dsn_env instead (DECISIONS.md D-14).
  - key: execute_dsn
    required_for: [query]
    description: >-
      DSN for the dedicated execution role - read-only at the database
      level and distinct from the introspection role (G3). The executor
      verifies the role's grants at startup and per query, and refuses
      to serve execution if the role can write. Provisioning SQL and
      runbook: deploy/execution-role.sql.
rate_limit: { strategy: none }
# A-3: the SDK's builtin probe (job type `test_connection`). For this
# connector it runs the two checks a live snapshot job runs first —
# connect as the introspection role, verify it holds neither SUPERUSER
# nor BYPASSRLS (D-71.2) — plus the G3 execution-role wall through the
# executor's own preflight. In ddl-file mode it verifies the files and
# reports, rather than implies, that no credential was tested.
health_probe: builtin

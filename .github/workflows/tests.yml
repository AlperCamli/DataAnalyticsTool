# Repo-wide test workflow (task 1.2 exit criterion: C-2/C-3 green in CI
# using containers). The postgres-marked tests spin real containers —
# Docker is available on ubuntu-latest runners. Tasks 1.3/1.4 reuse this
# workflow; connectors must not add their own.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Pre-pull postgres image
        run: docker pull --quiet postgres:16
      - name: Run full suite (incl. postgres containers)
        run: python -m pytest -v

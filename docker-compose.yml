# Local dev stack (CP-3a ruling A1): core + Postgres + one runner, plus
# (CP-4) the dev OIDC provider for the MCP surface.
#
#   docker compose up -d --build
#   make stack-demo        # enqueue the no-credentials demo jobs
#
# Live mode against configured external sources adds the git-ignored overlay:
#   docker compose -f docker-compose.yml -f deploy/compose.live.yml up -d
#   make stack-live
#
# One runner token bound to the one local runner (J-8) and, since the
# P-A auth split (D-66.1), a distinct ops service token for the
# enqueue/read surface — override via CL_RUNNER_TOKEN / CL_OPS_TOKEN.
#
# MCP (CP-4): armed by CORE_MCP_ENABLED in deploy/core.defaults.env (off)
# and deploy/core.live.env (on), against the devidp service — DEV ONLY; a
# real deployment points CORE_OIDC_ISSUER at the customer IdP. For a
# second-machine demo set CL_HOST_ADDR to this machine's LAN IP and
# CL_BIND=0.0.0.0 so the issuer in the discovery metadata is reachable
# from both the containers and the remote client.
#
# FEATURE TOGGLES ARE NOT SET HERE (D-110.2). `CORE_MCP_ENABLED=1 docker
# compose up` does nothing: compose only reads the shell for `${...}`
# interpolation, and no toggle is interpolated any more. Set toggles in
# an env file, or use `make stack-mcp` / `make stack-live`, which guard
# against the old habit. `curl /healthz` reports every toggle as the
# process resolved it — that is the check, not the process environment.

services:
  postgres:
    image: postgres:16
    environment:
      # DEV ONLY: local fixture password; never use this value in deployment.
      POSTGRES_PASSWORD: contextlayer
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
      - ./fixtures/supabase-customer.sql:/seed/supabase-customer.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Secrets home (A-4). DEV MODE — in-memory, auto-unsealed, root token
  # known and committed. A customer deployment runs a sealed, persistent
  # Vault that an operator unseals; the platform code cannot tell the
  # difference, which is the point. `deploy/vault-seed.sh` creates the
  # policies and AppRole identities a real one needs.
  vault:
    image: hashicorp/vault:1.17
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    volumes:
      - ./deploy/vault-seed.sh:/vault/seed.sh:ro
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 3s
      retries: 30

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    # Feature toggles and every setting a *deployment* supplies live here,
    # never in `environment:` below — compose ranks `environment:` above
    # `env_file:`, so a toggle written there can never be raised by an
    # overlay (D-110.2; D-84.2's shape, third occurrence). Later files in
    # this list win, which is how the live and baseline overlays layer.
    env_file:
      - ./deploy/core.defaults.env
      # A-4: how this core reaches its secrets home. Dev values here; the
      # live overlay replaces them with the pilot's AppRole identity.
      - ./deploy/vault-dev.env
    environment:
      # Only values THIS FILE computes belong here — interpolation from
      # the invoking shell, or constants of the dev stack. Anything a
      # deployment hands us goes in the env file above.
      CORE_DATABASE_URL: postgres://postgres:contextlayer@postgres:5432/cl_ops
      CORE_RUNNER_TOKENS: runner-local=${CL_RUNNER_TOKEN:-dev-runner-token}
      # P-A (D-66.1): the ops/read surface takes its own service-token
      # set; the CLI below authenticates with it, not the runner token.
      CORE_OPS_TOKENS: ops-local=${CL_OPS_TOKEN:-dev-ops-token}
      # for `node dist/cli.js enqueue` runs inside the container
      CORE_URL: http://127.0.0.1:8100
      CORE_TOKEN: ${CL_OPS_TOKEN:-dev-ops-token}
      # devidp is DEV ONLY — a real deployment points this at the
      # customer IdP. Computed from CL_HOST_ADDR, so it stays here.
      CORE_OIDC_ISSUER: http://${CL_HOST_ADDR:-host.docker.internal}:8180
      CORE_PUBLIC_URL: http://${CL_HOST_ADDR:-localhost}:8100
      CORE_OIDC_CLIENT_ID: core
      CORE_OIDC_CLIENT_SECRET: dev-introspect-secret
      # D-94.4: publish budget is the one MCP limit a demo/gate window
      # legitimately raises from the shell (an api-class report costs two
      # publish calls). Empty ⇒ the config default (4/h). A rate limit,
      # not a surface toggle — no env file supplies it.
      CORE_MCP_PUBLISH_PER_HOUR: ${CORE_MCP_PUBLISH_PER_HOUR:-}
      # §10 wheel provenance: the platform commit this image was built
      # from, which only the invoking shell knows.
      SYNC_PLATFORM_COMMIT: ${SYNC_PLATFORM_COMMIT:-}
    ports:
      - "${CL_BIND:-127.0.0.1}:8100:8100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      # The core resolves its `vault://` config references at boot and
      # refuses to start half-configured, so vault has to be up first.
      vault:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30

  # DEV-ONLY OIDC provider for the CP-4 MCP surface (no customer IdP in
  # the pilot). Users/roles in deploy/oidc/users.json; roles are mutable
  # at runtime via POST /admin/roles — the MT-9 live-revocation lever.
  devidp:
    build:
      context: .
      dockerfile: core/Dockerfile
    command: ["node", "dist/devidp.js", "/etc/contextlayer/idp-users.json"]
    environment:
      DEVIDP_PORT: 8180
      DEVIDP_HOST: ${CL_HOST_ADDR:-host.docker.internal}
    volumes:
      - ./deploy/oidc/users.json:/etc/contextlayer/idp-users.json:ro
    ports:
      - "${CL_BIND:-127.0.0.1}:8180:8180"

  runner:
    build:
      context: .
      dockerfile: deploy/runner.Dockerfile
    env_file:
      # A-4: the runner's own vault identity. It resolves job credential
      # references under this, and nothing else — least privilege between
      # it and the core is a policy in deploy/vault-seed.sh, not a
      # convention. The live overlay replaces it with the pilot's AppRole.
      - ./deploy/vault-dev.env
    environment:
      CL_RUNNER_TOKEN: ${CL_RUNNER_TOKEN:-dev-runner-token}
      # demo source for the postgres connector (live mode, in-stack)
      DEMO_DSN: postgres://postgres:contextlayer@postgres:5432/cl_demo
    volumes:
      - ./deploy/runner-config.yaml:/etc/contextlayer/runner.yaml:ro
    depends_on:
      core:
        condition: service_healthy
      vault:
        condition: service_healthy

volumes:
  pgdata:

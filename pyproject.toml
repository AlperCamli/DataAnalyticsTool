[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextlayer-snapshot"
# 0.3.0: D-49 purpose merge — enrichment slots in renders, KB-8 render
# consistency + KB-10 purpose-key warns in the validation library — the
# build class vendored into KB CI (D-46 condition 1)
# 0.4.0: CP-3b sync stages — lineage.severity (§7 note ³ finalization),
# lineage.scan (KB §6 contamination scan), generator.statuses
# (front-matter status writes). No validation-rule changes; the version
# bump makes the §10 wheel carry state the new surface honestly.
# 0.5.0: CP-4 sqlval — the validate_sql SQL dialect as a stage CLI
# (MCP §6.6, MCP-R6/R7). No validation-rule changes to the KB CI
# surface; the bump keeps the §10 wheel carry honest.
# 0.6.0: SS-5 capture (ruling D-96.3d) — `stats.checks` registered on
# `table` (hash-included) plus the generator's Check-constraints line.
# This one DOES change the KB CI surface twice over: C-8 now admits a
# stats field it used to reject, and KB-8 render consistency compares
# against a template that emits a new section. A KB validating with the
# 0.5.0 wheel would call the new machine docs stale — which is exactly
# the stale-wheel failure D-46 exists to make visible, so the carry is
# not optional here.
version = "0.6.0"
description = "Snapshot layer (task 1.1) + connector SDK (1.2-1.4) + generator (1.5) + lineage (1.9)"
requires-python = ">=3.12"
dependencies = [
    # format-nongpl pulls rfc3339-validator: without it jsonschema treats
    # `format: date-time` as annotation-only and captured_at goes unchecked
    "jsonschema[format-nongpl]>=4.21",
    # connector manifests are connector.yaml (capability spec §3)
    "PyYAML>=6.0",
    # postgres connector (task 1.2); DECISIONS.md D-21 stack amendment
    "psycopg[binary]>=3.2",
    # ga4 (task 1.3) + gsc (task 1.4) connectors: plain REST +
    # service-account auth; DECISIONS.md D-22/D-29 stack amendments
    # (no generated Google clients)
    "google-auth>=2.29",
    "requests>=2.31",
    # generator templates (task 1.5); DECISIONS.md D-37 stack amendment
    "jinja2>=3.1",
    # lineage parser (task 1.9); DECISIONS.md D-38 stack amendment —
    # floor here, exact pin in constraints.txt (used by CI); trusted only
    # for engine-deparsed canonical SELECTs (D-19.2 input class)
    "sqlglot>=25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
]
# benchmark Backend B (headless Claude Code): the local MCP executor server.
# Not needed by the core, CI integrity check, or Backend A.
bench = [
    "mcp>=1.0",
]

[tool.setuptools]
packages = ["snapshot", "sqlval", "connectors", "connectors.sdk", "connectors.static_demo", "connectors.postgres", "connectors.ga4", "connectors.gsc", "generator", "lineage", "benchmark"]

[tool.setuptools.package-data]
snapshot = ["schema/*.json"]
"connectors.sdk" = ["schema/*.json"]
"connectors.static_demo" = ["connector.yaml", "*.json"]
"connectors.postgres" = ["connector.yaml", "*.json"]
"connectors.ga4" = ["connector.yaml", "*.json"]
"connectors.gsc" = ["connector.yaml", "*.json"]
generator = ["templates/*.j2"]
benchmark = ["schema/*.json", "suite/*.yaml", "suite/snapshots/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs Docker (spins ephemeral postgres containers); skipped when the daemon is unreachable",
    "ga4_live: live GA4 pull against the customer property; skipped unless CTXLAYER_GA4_LIVE is set (needs CTXLAYER_GA4_PROPERTY_ID + GOOGLE_APPLICATION_CREDENTIALS)",
    "gsc_live: live Search Console pull against the customer property; skipped unless CTXLAYER_GSC_LIVE is set (needs CTXLAYER_GSC_SITE_URL + GOOGLE_APPLICATION_CREDENTIALS)",
    "postgres_live: live governed execution against the customer database under the dedicated read-only execution role (G3); skipped unless CTXLAYER_PG_EXEC_LIVE is set (needs CTXLAYER_PG_EXEC_DSN)",
    "powerbi_live: live Power BI push+PBIR delivery to the configured workspace (CP-7 step 8); skipped unless CTXLAYER_POWERBI_LIVE is set (needs CTXLAYER_PG_EXEC_DSN + .secrets/powerbi.env)",
]

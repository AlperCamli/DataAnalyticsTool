  - id: RB-07
    request: "How well do new users activate — signup, build a CV, export, subscribe? Show me that funnel."
    origin: "customer-stated, 2026-07-15 (extra: success measurement, customer-selected)"
    recurring: true
    visual_kind: other:funnel        # ordered activation stages, one cohort
    systems: [supabase]
    expected_objects:
      - supabase.public.users
      - supabase.public.master_cvs
      - supabase.public.tailored_cvs
      - supabase.public.exports
      - supabase.public.subscriptions
    resolution_notes: >
      Resolved with customer: same-month activation (deterministic) with completed exports.
      Cohort = users who signed up in June 2026. A cohort user counts toward a step only if the
      step occurred by 2026-06-30 (created_at < 2026-07-01Z). Steps, each de-duplicated to distinct
      cohort users: (1) signed up, (2) created a master CV (is_deleted=false), (3) created a
      tailored CV (is_deleted=false), (4) exported = >=1 export with status='completed',
      (5) subscribed = >=1 subscription row. This is row-level joinable WITHIN Supabase (users.id
      fan-out) — unlike RB-05, no cross-system reconciliation is involved. Trade-off recorded: a
      June-29 signup who exports July 2 is not counted (same-month rule) — chosen for determinism.
    window: { phrasing: "June 2026 signup cohort, same-month actions", from: "2026-06-01", to: "2026-06-30", grain: "created_at cohort + <2026-07-01Z action cutoff" }
    golden:
      - system: supabase
        request:
          dialect: sql
          statement: |
            SET statement_timeout = '30s';
            WITH cohort AS (
              SELECT id
              FROM public.users
              WHERE created_at >= '2026-06-01T00:00:00Z'
                AND created_at <  '2026-07-01T00:00:00Z'
            )
            SELECT
              (SELECT count(*) FROM cohort)                                     AS s1_signed_up,
              (SELECT count(DISTINCT m.user_id)
                 FROM public.master_cvs m JOIN cohort c ON c.id = m.user_id
                 WHERE m.is_deleted = false
                   AND m.created_at < '2026-07-01T00:00:00Z')                   AS s2_created_master_cv,
              (SELECT count(DISTINCT t.user_id)
                 FROM public.tailored_cvs t JOIN cohort c ON c.id = t.user_id
                 WHERE t.is_deleted = false
                   AND t.created_at < '2026-07-01T00:00:00Z')                   AS s3_created_tailored_cv,
              (SELECT count(DISTINCT e.user_id)
                 FROM public.exports e JOIN cohort c ON c.id = e.user_id
                 WHERE e.status = 'completed'
                   AND e.created_at < '2026-07-01T00:00:00Z')                   AS s4_exported,
              (SELECT count(DISTINCT s.user_id)
                 FROM public.subscriptions s JOIN cohort c ON c.id = s.user_id
                 WHERE s.created_at < '2026-07-01T00:00:00Z')                   AS s5_subscribed;
    blend: null
    verified_result:
      status: pending-execution-deferred
      row_count: null
      rows: null
      summary: null
      checksum: null
      executed_at: null
      note: "One row, 5 monotonically non-increasing stage counts (funnel). Byte-stable once executed."
    verified_by: "design/intent confirmed by customer 2026-07-15; numeric result pending execution"
    notes: "Byte-stable golden (closed cohort + closed action window, all timestamps immutable). Safe for byte-comparison."


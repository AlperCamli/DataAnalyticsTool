    resolution_notes: >
      Resolved with customer: scheduled-cancels + churn-risk % as a one-row scorecard. Among the
      active/trialing base (status IN ('active','trialing') — the <=1-per-user live states),
      scheduled_to_cancel = those with cancel_at_period_end = true (a scheduled cancel that has NOT
      yet ended — distinct from a terminal 'canceled' status, per subscriptions.md). churn_risk_pct
      = scheduled / active_base * 100. Terminal-canceled counts intentionally excluded (customer
      chose the forward-looking signal). Live snapshot of mutable flags.
    window: { phrasing: "current (as of execution)", from: null, to: null, as_of: "execution time", note: "live snapshot" }
    golden:
      - system: supabase
        request:
          dialect: sql
          statement: |
            SET statement_timeout = '30s';
            SELECT
              count(*) FILTER (WHERE status IN ('active','trialing'))                          AS active_base,
              count(*) FILTER (WHERE status IN ('active','trialing') AND cancel_at_period_end)  AS scheduled_to_cancel,
              round(100.0 * count(*) FILTER (WHERE status IN ('active','trialing') AND cancel_at_period_end)
                    / nullif(count(*) FILTER (WHERE status IN ('active','trialing')), 0), 1)    AS churn_risk_pct
            FROM public.subscriptions;

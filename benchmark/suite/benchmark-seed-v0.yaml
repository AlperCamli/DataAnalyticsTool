  - id: RB-09
    request: "Keep an eye on our AI runs — how many are failing, and is the error rate creeping up?"
    origin: "customer-stated, 2026-07-15 (extra: anomaly/risk, customer-selected)"
    recurring: true
    visual_kind: line
    systems: [supabase]
    expected_objects:
      - supabase.public.ai_runs
    resolution_notes: >
      Resolved with customer: daily grain over June 2026; failure flagged by status = 'failed'.
      KB-vs-CUSTOMER NOTE (conventions.md trust rules): ai_runs.status is text with NO DB CHECK —
      its value vocabulary is UNGROUNDED in the KB. Customer chose the status='failed' signal over
      the error_message-based one; recorded per HARD RULE 5 (customer is authority). RISK: if the
      real failure value is spelled differently (e.g. 'error'), failed_runs is undercounted. The
      grounding query in notes MUST be run first at execution to confirm the exact value.
      failure_pct = failed/total*100, rounded 1dp; started_at bucketed in UTC.
    window: { phrasing: "June 2026", from: "2026-06-01", to: "2026-06-30", grain: day, tz: UTC }
    golden:
      - system: supabase
        request:
          dialect: sql
          statement: |
            SET statement_timeout = '30s';
            SELECT date_trunc('day', started_at AT TIME ZONE 'UTC')::date AS run_day,
                   count(*)                                         AS total_runs,
                   count(*) FILTER (WHERE status = 'failed')        AS failed_runs,
                   round(100.0 * count(*) FILTER (WHERE status = 'failed')
                         / nullif(count(*), 0), 1)                  AS failure_pct
            FROM public.ai_runs
            WHERE started_at >= '2026-06-01T00:00:00Z'
              AND started_at <  '2026-07-01T00:00:00Z'
            GROUP BY 1
            ORDER BY 1;
    blend: null
    verified_result:
      status: pending-execution-deferred
      row_count: null
      rows: null
      summary: null
      checksum: null
      executed_at: null
      note: "GROUNDING FIRST: SELECT status, count(*) FROM public.ai_runs GROUP BY 1 ORDER BY 2 DESC; confirm 'failed' is the real value before trusting failed_runs."
    verified_by: "design/intent confirmed by customer 2026-07-15; numeric result pending execution"
    notes: >
      Deterministic over the closed window IF the status value is correct (immutable once runs
      settle). The ungrounded status enum is the risk — treat as byte-stable only after the
      grounding query confirms the 'failed' spelling; otherwise structural.

  - id: RB-10
    request: "Watch churn for me — how many paying subscriptions are set to cancel?"
    origin: "customer-stated, 2026-07-15 (extra: anomaly/risk, customer-selected)"
    recurring: true
    visual_kind: scorecard
    systems: [supabase]
    expected_objects:
